<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#3dff1f;--g2:#1a8f0c;--bg:#050805;--card:#0e170e;--t:#e9ffe6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font-family:Caveat,"Comic Sans MS",cursive;font-size:22px;overflow:hidden}
.s{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;text-align:center;overflow-y:auto;background:radial-gradient(circle at 50% 30%,#12330d,var(--bg) 70%)}
.s.on{display:flex;animation:in .6s}
@keyframes in{from{opacity:0;transform:scale(.94)}}
h1,h2,.b{font-family:Bangers,Impact,sans-serif;letter-spacing:2px;margin:0;font-weight:400}
h1{font-size:clamp(44px,12vw,92px);color:var(--g);text-shadow:0 0 18px var(--g2),4px 4px 0 #000;transform:rotate(-3deg)}
h2{font-size:clamp(32px,8vw,56px);color:var(--g);text-shadow:3px 3px 0 #000}
.b{background:var(--g);color:#031200;border:0;border-radius:12px;padding:12px 28px;font-size:28px;cursor:pointer;box-shadow:0 6px 0 var(--g2);transition:transform .1s}
.b:active{transform:translateY(5px);box-shadow:0 1px 0 var(--g2)}
.b:focus-visible{outline:3px solid #fff}
/* watch */
.watch{width:min(62vw,260px);cursor:pointer;animation:pulse 2s infinite}
.watch .dial{transform-origin:100px 100px;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{filter:drop-shadow(0 0 28px var(--g))}}
.watch.go{animation:flash .8s forwards}
@keyframes flash{to{transform:scale(9);opacity:0}}
/* photo slots */
.ph{width:150px;height:170px;background:#fff;padding:8px 8px 30px;border-radius:4px;box-shadow:0 8px 20px #000;transform:rotate(var(--r,-4deg));position:relative;cursor:pointer;color:#222;font-size:18px}
.ph i{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#dfe8dc center/cover;font-style:normal;border:2px dashed var(--g2)}
.ph input{display:none}
.row{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
/* envelope */
.env{position:relative;width:min(80vw,320px);height:min(52vw,210px);cursor:pointer;animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.env .back,.env .front{position:absolute;inset:0;background:#145e0c;border-radius:8px}
.env .front{background:linear-gradient(135deg,transparent 50%,#1c8a10 50%) , linear-gradient(225deg,transparent 50%,#1f9a12 50%);clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:3}
.env .flap{position:absolute;left:0;right:0;top:0;height:60%;background:#26b516;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s,z-index 0s .4s;z-index:4}
.env .paper{position:absolute;left:8%;right:8%;top:6%;bottom:6%;background:#f4ffe9;border-radius:4px;z-index:2;transition:transform .9s .6s}
.env .seal{position:absolute;left:50%;top:48%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#000;border:3px solid var(--g);z-index:5;transition:opacity .3s}
.env.open{animation:none}.env.open .flap{transform:rotateX(180deg);z-index:1}.env.open .paper{transform:translateY(-70%)}.env.open .seal{opacity:0}
.letter{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#000d;z-index:9;padding:16px}
.letter.on{display:flex;animation:in .6s}
.paperbig{background:#f4ffe9;color:#142a10;max-width:560px;max-height:90%;overflow:auto;padding:26px;border-radius:6px;border-left:8px solid var(--g2);box-shadow:0 0 40px var(--g2);font-size:24px;line-height:1.35;text-align:left}
.paperbig .b{display:block;margin:12px auto 0}
/* plan */
.plan{display:grid;gap:12px;width:min(92vw,460px)}
.plan div{background:var(--card);border:3px solid var(--g);border-radius:14px;padding:12px;box-shadow:0 0 16px var(--g2)}
.plan small{display:block;font-family:Bangers,Impact;color:var(--g);font-size:22px;letter-spacing:2px}
.plan span{font-size:30px}
/* hints */
.flip{width:170px;height:200px;perspective:700px;cursor:pointer}
.flip>div{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.f>div{transform:rotateY(180deg)}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:10px;border:3px solid var(--g)}
.flip .fa{background:var(--card);font-family:Bangers,Impact;font-size:30px;color:var(--g)}
.flip .fb{background:var(--g);color:#031200;transform:rotateY(180deg);font-size:23px;line-height:1.15}
/* game */
#arena{position:relative;width:min(94vw,520px);height:52vh;border:3px solid var(--g);border-radius:14px;overflow:hidden;background:#071307;touch-action:manipulation}
.orb{position:absolute;top:-60px;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(#7aff5f,#1a8f0c);box-shadow:0 0 16px var(--g);animation:fall linear forwards;cursor:pointer;user-select:none}
@keyframes fall{to{transform:translateY(60vh)}}
.pop{animation:pop .25s forwards!important}@keyframes pop{to{transform:scale(1.8);opacity:0}}
.hud{display:flex;gap:22px;font-family:Bangers,Impact;font-size:30px;color:var(--g)}
.conf{position:fixed;top:-20px;width:10px;height:14px;z-index:20;animation:cf linear forwards;pointer-events:none}
@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style></head><body>

<section class="s on" id="s0">
  <h2>Incoming transmission…</h2>
  <svg class="watch" id="watch" viewBox="0 0 200 200" role="button" aria-label="Tap the watch">
    <circle cx="100" cy="100" r="96" fill="#111" stroke="#3dff1f" stroke-width="6"/>
    <g class="dial"><circle cx="100" cy="100" r="74" fill="#1a8f0c"/>
    <path d="M52 52H148L112 100L148 148H52L88 100Z" fill="#050805" stroke="#3dff1f" stroke-width="4"/></g>
    <circle cx="100" cy="100" r="10" fill="#3dff1f"/>
  </svg>
  <button class="b" id="go">Tap to transform</button>
</section>

<section class="s" id="s1">
  <h1 id="hb">HAPPY BIRTHDAY!</h1>
  <h2 id="nm"></h2>
  <div class="row" id="ph1"></div>
  <button class="b" data-next>You have mail</button>
</section>

<section class="s" id="s2">
  <h2>A letter for you</h2>
  <div class="env" id="env" role="button" aria-label="Open the letter"><div class="back"></div><div class="paper"></div><div class="front"></div><div class="flap"></div><div class="seal"></div></div>
  <div>Tap the envelope</div>
  <div class="letter" id="lt"><div class="paperbig"><div id="ltxt"></div><button class="b" id="ltn" style="display:none" data-next>Next mission</button></div></div>
</section>

<section class="s" id="s3">
  <h2>Your mission</h2>
  <div class="plan" id="plan"></div>
  <button class="b" data-next>Need a hint?</button>
</section>

<section class="s" id="s4">
  <h2>Tap to reveal the clues</h2>
  <div class="row" id="hints"></div>
  <button class="b" data-next>Play the game</button>
</section>

<section class="s" id="s5">
  <h2>Power up!</h2>
  <div class="hud"><span>Score: <b id="sc">0</b></span><span>Time: <b id="tm">25</b></span></div>
  <div id="arena"></div>
  <div id="gmsg">Catch 15 energy orbs before time runs out!</div>
  <button class="b" id="start">Start</button>
</section>

<section class="s" id="s6">
  <h1>YOU WIN!</h1>
  <h2>Best boyfriend ever, level unlocked</h2>
  <div class="row" id="ph2"></div>
  <button class="b" id="again">Play again</button>
</section>

<script>
/* ===== EDIT ME: change the text between the quotes. Photos: put 1.jpg to 6.jpg in the photos folder ===== */
var C={
 name:"Man3oom", from:"your loving girlfriend",
 date:"17/11/2026", place:"I won't tell you", time:"1 PM",
 hints:["Bring your appetite","Wear comfy shoes","Bring a jacket","Be ready to smile"],
 hintTitles:["Clue 1","Clue 2","Clue 3","Clue 4"],
 letter:"Happy birthday love!.\n\nLoving you is one of the best things that has ever happened to me. I always feel blessed, but this year felt even more special. I'm glad I got to see the world and be part of your year. Thank you for being such a wonderful person to me and to all people who got lucky to know you.\n\nOn your birthday, I want you to know how deeply I appreciate your presence. I wish you endless happiness, peace of mind, and everything you dream of. I'm sorry you get to spend this birthday in Egypt (and that we also have to wait one extra day to celebrate), I hope next year we get to spend it somewhere cooler. Happy birthday babe. I hope your day is as amazing as you are.\n\nLove, ",
 target:15, seconds:25
};
/* ==================== */
var $=function(i){return document.getElementById(i)};
var cur=0;
function show(n){document.querySelectorAll('.s').forEach(function(e){e.classList.remove('on')});$('s'+n).classList.add('on');cur=n}
document.querySelectorAll('[data-next]').forEach(function(b){b.onclick=function(){$('lt').classList.remove('on');show(cur+1)}});
function slot(i,r){var d=document.createElement('div');d.className='ph';d.style.setProperty('--r',r+'deg');
 var im=document.createElement('i');im.textContent='photo '+(i+1);d.appendChild(im);
var n=i+1,ex=['.jpg','.JPG','.jpeg','.JPEG','.png','.PNG'],k=0,t=new Image();t.onload=function(){im.textContent='';im.style.backgroundImage='url('+t.src+')'};t.onerror=function(){k++;if(k<ex.length)t.src=n+ex[k]};t.src=n+ex[0];return d}function confetti(){var cs=['#3dff1f','#fff','#1a8f0c','#b6ff9e'];for(var i=0;i<60;i++){var e=document.createElement('div');e.className='conf';e.style.left=Math.random()*100+'vw';e.style.background=cs[i%4];e.style.animationDuration=(2+Math.random()*2.5)+'s';e.style.animationDelay=Math.random()+'s';document.body.appendChild(e);setTimeout(function(x){x.remove()},5500,e)}}
$('nm').textContent=C.name;
$('go').onclick=$('watch').onclick=function(){$('watch').classList.add('go');setTimeout(function(){show(1);confetti()},750)};
/* letter */
$('env').onclick=function(){var e=$('env');if(e.classList.contains('open'))return;e.classList.add('open');
 setTimeout(function(){$('lt').classList.add('on');type(C.letter+C.from)},1700)};
function type(t){var o=$('ltxt'),i=0;o.style.whiteSpace='pre-wrap';o.textContent='';$('ltn').style.display='none';
 (function s(){o.textContent=t.slice(0,i);i+=2;if(i<=t.length+1)setTimeout(s,22);else $('ltn').style.display='block'})()}
/* plan */
$('plan').innerHTML=[['DATE',C.date],['PLACE',C.place],['TIME',C.time]].map(function(a){return '<div><small>'+a[0]+'</small><span>'+a[1]+'</span></div>'}).join('');
/* hints */
C.hints.forEach(function(h,i){var f=document.createElement('div');f.className='flip';f.tabIndex=0;
 f.innerHTML='<div><div class="fa">'+C.hintTitles[i]+'</div><div class="fb">'+h+'</div></div>';
 f.onclick=function(){f.classList.toggle('f')};$('hints').appendChild(f)});
/* game */
var score=0,left=0,tick,spawn,run=false;
function endGame(){run=false;clearInterval(tick);clearInterval(spawn);$('arena').innerHTML='';
 if(score>=C.target){$('gmsg').textContent='Mission complete!';confetti();setTimeout(function(){show(6)},900)}
 else{$('gmsg').textContent='So close! You got '+score+'. Try again.';$('start').textContent='Retry';$('start').style.display=''}}
$('start').onclick=function(){score=0;left=C.seconds;run=true;$('sc').textContent=0;$('tm').textContent=left;$('start').style.display='none';$('gmsg').textContent='Tap the orbs!';
 tick=setInterval(function(){left--;$('tm').textContent=left;if(left<=0)endGame()},1000);
 spawn=setInterval(function(){var o=document.createElement('div');o.className='orb';o.textContent=['💚','⚡','🎂'][Math.floor(Math.random()*3)];
  o.style.left=Math.random()*(Math.min(window.innerWidth*.94,520)-60)+'px';o.style.animationDuration=(2.2+Math.random()*1.5)+'s';
  var hit=function(e){e.preventDefault();if(!run||o.classList.contains('pop'))return;score++;$('sc').textContent=score;o.classList.add('pop');setTimeout(function(){o.remove()},250);if(score>=C.target)endGame()};
  o.addEventListener('pointerdown',hit);o.addEventListener('animationend',function(){o.remove()});$('arena').appendChild(o)},520)};
$('again').onclick=function(){$('start').textContent='Start';$('start').style.display='';$('gmsg').textContent='Catch '+C.target+' energy orbs before time runs out!';show(5)};
</script></body></html>
